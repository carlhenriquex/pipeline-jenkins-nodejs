name: pipeline CI

on:
  push:
    branches:
      [feat/adicionando-pipeline, main]

jobs:
  build and test: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
      - uses: actions/checkout@v7

      - name: Set up node
      - uses: actions/setup-node@v7

      - name: Install dependencies
        run: npm ci

      - name: run test
        run: run test